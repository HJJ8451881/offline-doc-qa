services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docqa}
      POSTGRES_DB: ${POSTGRES_DB:-docqa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 不對外開 5432：app 容器透過 docker network 內部的 `db` hostname 連線即可，
    # 對外開埠只是為了方便本機用 psql 除錯，若沒有埠衝突可自行加回
    # `ports: ["5432:5432"]`。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docqa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      # 讓容器內的 app 能連到跑在 host 上的 Ollama（Linux 原生 docker 需要這行；
      # Docker Desktop for Mac/Windows 內建支援 host.docker.internal）。
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
